<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Glimmerfield</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1620;font-family:system-ui,-apple-system,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block}
.ui{position:fixed;color:#fff;pointer-events:none;text-shadow:0 1px 4px #000}
#hud{top:calc(env(safe-area-inset-top,0px) + 12px);left:14px;font-size:14px;line-height:1.55}
#dex{top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;background:rgba(0,0,0,.45);border-radius:10px;padding:7px 10px;font-size:12px;line-height:1.5;min-width:130px;text-shadow:none}
#msg{left:50%;top:34%;transform:translate(-50%,-50%);font-size:19px;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .3s}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;color:#fff;background:linear-gradient(160deg,#ff7a59,#7a2ee0 60%,#1a0b3d)}
#start h1{margin:0;font-size:38px;letter-spacing:3px}
#start p{margin:0;max-width:340px;line-height:1.5;opacity:.85}
#play{margin-top:10px;font-size:20px;padding:14px 44px;border:0;border-radius:30px;background:#ffd166;color:#1a0b3d;font-weight:700;cursor:pointer}
#rot{display:none;position:fixed;inset:0;z-index:50;background:#0b1620;color:#fff;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:30px}
@media (orientation:landscape) and (pointer:coarse){#rot{display:flex}}
#joy{position:fixed;left:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);display:none}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.4)}
#throw{position:fixed;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:84px;height:84px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(125,227,196,.35);color:#fff;font-size:15px;font-weight:700;display:none}
</style>
</head>
<body>
<div id="rot">Turn your phone upright to play.</div>
<div id="hud" class="ui"></div>
<div id="dex" class="ui"></div>
<div id="msg" class="ui"></div>
<div id="joy"><div id="knob"></div></div>
<button id="throw">THROW</button>
<div id="start">
  <h1>GLIMMERFIELD</h1>
  <p>Explore a vast open world through dawn, dusk, and night. Catch original creatures with glimmer orbs and fill your field guide.</p>
  <p style="font-size:14px">Keyboard: WASD or arrows, Space to throw, drag to look.<br>Phone: hold upright, left pad to move, drag to look, tap THROW.</p>
  <button id="play">Play</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const hudEl = $('hud'), dexEl = $('dex'), msgEl = $('msg');
const SIZE = 400, WORLD = 180;

// ---------- Original creature species ----------
const SPECIES = [
  {name:'Glimmo',    rarity:1, w:3, body:0x7fe7ff, accent:0xffffff, size:1.0,  shape:'blob', fly:false, speed:2.4},
  {name:'Emberpup',  rarity:1, w:3, body:0xff9a4d, accent:0x7a2e12, size:1.05, shape:'pup',  fly:false, speed:3.2},
  {name:'Mossling',  rarity:2, w:2, body:0x8fd672, accent:0x2f6b3a, size:1.25, shape:'moss', fly:false, speed:1.8},
  {name:'Frostwisp', rarity:2, w:2, body:0xd6f2ff, accent:0x4f9cff, size:0.9,  shape:'wisp', fly:true,  speed:2.8},
  {name:'Voltmoth',  rarity:3, w:1, body:0xffe45c, accent:0x6a4cff, size:1.0,  shape:'wisp', fly:true,  speed:3.6}
];
const CATCH = {1:0.7, 2:0.5, 3:0.3};
const POOL = []; SPECIES.forEach(s => { for (let i = 0; i < s.w; i++) POOL.push(s); });
const pickSpecies = () => POOL[Math.floor(Math.random() * POOL.length)];

let dex = {};
try { dex = JSON.parse(localStorage.getItem('glimmerfield-dex')) || {}; } catch (e) {}
function saveDex() { try { localStorage.setItem('glimmerfield-dex', JSON.stringify(dex)); } catch (e) {} }

// ---------- Renderer ----------
const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.NoToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xc4e6ff, 0.0045);
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 900);
let camDist = 9;
function fitCamera() {
  const portrait = innerHeight > innerWidth;
  camera.aspect = innerWidth / innerHeight;
  camera.fov = portrait ? 68 : 58;
  camera.updateProjectionMatrix();
  camDist = portrait ? 10 : 9;
}
fitCamera();

// ---------- Sky dome with sun glow ----------
const skyU = {
  top: {value: new THREE.Color()}, hor: {value: new THREE.Color()},
  sunDir: {value: new THREE.Vector3(0, 1, 0)}, sunCol: {value: new THREE.Color(0xfff2d6)}
};
const sky = new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 top; uniform vec3 hor; uniform vec3 sunDir; uniform vec3 sunCol; varying vec3 vP;
    void main(){
      vec3 d = normalize(vP);
      vec3 c = mix(hor, top, smoothstep(0.0, 0.55, d.y));
      float s = max(dot(d, sunDir), 0.0);
      c += sunCol * (pow(s, 400.0) * 2.0 + pow(s, 12.0) * 0.25);
      gl_FragColor = vec4(c, 1.0);
    }`
}));
sky.renderOrder = -1;
scene.add(sky);

// ---------- Lights ----------
const hemi = new THREE.HemisphereLight(0xdfefff, 0x3d5a2e, 0.8);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1d0, 2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left: -55, right: 55, top: 55, bottom: -55, near: 1, far: 320});
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0006;
scene.add(sun);
scene.add(sun.target);

// ---------- Terrain ----------
function hash(x, y) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function heightAt(x, z) {
  let h = 0, a = 1, f = 0.011, t = 0;
  for (let i = 0; i < 5; i++) { h += vnoise(x * f + 31.7, z * f - 12.3) * a; t += a; a *= 0.5; f *= 2.03; }
  h /= t;
  const edge = Math.pow(Math.max(Math.abs(x), Math.abs(z)) / (SIZE * 0.5), 3) * 0.3;
  const ridge = 1 - Math.abs(vnoise(x * 0.007 + 7.1, z * 0.007 - 3.3) * 2 - 1);
  return (h - edge - 0.38) * 56 + ridge * ridge * 16 - 2;
}

const geo = new THREE.PlaneGeometry(SIZE, SIZE, 180, 180).rotateX(-Math.PI / 2);
const P = geo.attributes.position;
for (let i = 0; i < P.count; i++) P.setY(i, heightAt(P.getX(i), P.getZ(i)));
geo.computeVertexNormals();
const N = geo.attributes.normal, colors = new Float32Array(P.count * 3), tc = new THREE.Color();
for (let i = 0; i < P.count; i++) {
  const x = P.getX(i), z = P.getZ(i), h = P.getY(i), ny = N.getY(i);
  let base;
  if (h < -0.6) base = 0x1f8fb8;
  else if (h < 1.8) base = 0xffd67a;
  else if (h > 25) base = 0xeef4f8;
  else if (ny < 0.72 || h > 20) base = 0xb37a5c;
  else base = 0x6ee06a;
  tc.setHex(base).multiplyScalar(0.9 + 0.2 * hash(Math.round(x * 2), Math.round(z * 2)));
  colors[i * 3] = tc.r; colors[i * 3 + 1] = tc.g; colors[i * 3 + 2] = tc.b;
}
geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const terrain = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({vertexColors: true, roughness: 0.9, flatShading: true}));
terrain.receiveShadow = true;
scene.add(terrain);

// Animated water
const waterG = new THREE.PlaneGeometry(SIZE * 1.5, SIZE * 1.5, 90, 90).rotateX(-Math.PI / 2);
const waterBase = waterG.attributes.position.array.slice();
const water = new THREE.Mesh(waterG, new THREE.MeshStandardMaterial({
  color: 0x35e0d0, roughness: 0.3, metalness: 0.0, transparent: true, opacity: 0.85
}));
scene.add(water);
function animateWater(t) {
  const a = waterG.attributes.position.array;
  for (let i = 0; i < a.length; i += 3) {
    const x = waterBase[i], z = waterBase[i + 2];
    a[i + 1] = Math.sin(x * 0.045 + t * 1.1) * 0.14 + Math.cos(z * 0.06 - t * 0.9) * 0.1;
  }
  waterG.attributes.position.needsUpdate = true;
  waterG.computeVertexNormals();
}

// Grass (instanced, one draw call)
const BLADES = 9000;
const grass = new THREE.InstancedMesh(
  new THREE.PlaneGeometry(0.18, 1.0).translate(0, 0.5, 0),
  new THREE.MeshStandardMaterial({roughness: 0.9, side: THREE.DoubleSide}),
  BLADES
);
{
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), sv = new THREE.Vector3(),
        pv = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0), gc = new THREE.Color();
  let placed = 0;
  for (let i = 0; placed < BLADES && i < BLADES * 4; i++) {
    const x = (Math.random() - 0.5) * WORLD * 2, z = (Math.random() - 0.5) * WORLD * 2, h = heightAt(x, z);
    if (h < 1.8 || h > 15) continue;
    pv.set(x, h, z);
    q.setFromAxisAngle(up, Math.random() * 6.28);
    sv.setScalar(0.6 + Math.random() * 0.8);
    m4.compose(pv, q, sv);
    grass.setMatrixAt(placed, m4);
    gc.setHSL(0.28 + Math.random() * 0.06, 0.8, 0.45 + Math.random() * 0.12);
    grass.setColorAt(placed, gc);
    placed++;
  }
  grass.count = placed;
}
scene.add(grass);

// Trees and rocks
const trunkM = new THREE.MeshStandardMaterial({color: 0x6b4a2b, roughness: 1});
const leafMs = [0x2f7d3a, 0x3c9446, 0x2a6b34].map(c => new THREE.MeshStandardMaterial({color: c, roughness: 0.85}));
const rockM = new THREE.MeshStandardMaterial({color: 0x8a8478, roughness: 0.95, flatShading: true});
const trunkG = new THREE.CylinderGeometry(0.3, 0.5, 2.8, 6);
const coneG = new THREE.ConeGeometry(2.3, 4.2, 7), coneG2 = new THREE.ConeGeometry(1.6, 3.2, 7);
const rockG = new THREE.DodecahedronGeometry(1.2, 0);
function addProp(x, z) {
  const h = heightAt(x, z);
  if (h < 1.5 || h > 22) return;
  const g = new THREE.Group();
  if (Math.random() < 0.8) {
    const t = new THREE.Mesh(trunkG, trunkM); t.position.y = 1.4; g.add(t);
    const m1 = new THREE.Mesh(coneG, leafMs[Math.floor(Math.random() * 3)]); m1.position.y = 4.3; g.add(m1);
    const m2 = new THREE.Mesh(coneG2, leafMs[Math.floor(Math.random() * 3)]); m2.position.y = 6.3; g.add(m2);
    g.scale.setScalar(0.8 + Math.random() * 0.6);
  } else {
    const r = new THREE.Mesh(rockG, rockM);
    r.position.y = 0.5; r.rotation.set(Math.random() * 3, Math.random() * 3, 0);
    r.scale.setScalar(0.8 + Math.random()); g.add(r);
  }
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  g.position.set(x, h, z);
  g.rotation.y = Math.random() * 6.28;
  scene.add(g);
}
for (let i = 0; i < 150; i++) addProp((Math.random() - 0.5) * SIZE * 0.85, (Math.random() - 0.5) * SIZE * 0.85);

// Fireflies (night)
const FF = 240, ffPos = new Float32Array(FF * 3), ffGeo = new THREE.BufferGeometry();
ffGeo.setAttribute('position', new THREE.BufferAttribute(ffPos, 3));
const ffMat = new THREE.PointsMaterial({color: 0xffb3ff, size: 0.35, transparent: true, opacity: 0,
  depthWrite: false, blending: THREE.AdditiveBlending});
const fireflies = new THREE.Points(ffGeo, ffMat);
fireflies.frustumCulled = false;
scene.add(fireflies);

// ---------- Player ----------
const player = {pos: new THREE.Vector3(), yaw: 0, pitch: 0.35, orbs: 10, caught: 0, walk: 0};
const pm = c => new THREE.MeshStandardMaterial({color: c, roughness: 0.7});
const avatar = new THREE.Group();
const pBody = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.6, 1.4, 12), pm(0x2a6fdb)); pBody.position.y = 1.1;
const pHead = new THREE.Mesh(new THREE.SphereGeometry(0.45, 14, 12), pm(0xffd7b0)); pHead.position.y = 2.2;
const pHat = new THREE.Mesh(new THREE.ConeGeometry(0.5, 0.6, 12), pm(0xff5b7a)); pHat.position.y = 2.75;
avatar.add(pBody, pHead, pHat);
avatar.traverse(o => { if (o.isMesh) o.castShadow = true; });
scene.add(avatar);

function randomLand(minH, minFrom) {
  for (let i = 0; i < 60; i++) {
    const x = (Math.random() - 0.5) * WORLD * 2, z = (Math.random() - 0.5) * WORLD * 2;
    if (heightAt(x, z) > minH && Math.hypot(x - player.pos.x, z - player.pos.z) > minFrom) return [x, z];
  }
  return [20, 20];
}
{
  let sx = 0, sz = 0;
  for (let i = 0; i < 300; i++) {
    const x = (Math.random() - 0.5) * 60, z = (Math.random() - 0.5) * 60;
    if (heightAt(x, z) > 3) { sx = x; sz = z; break; }
  }
  player.pos.set(sx, heightAt(sx, sz), sz);
}

// ---------- Creatures ----------
function buildCreature(sp) {
  const g = new THREE.Group();
  const bodyM = new THREE.MeshStandardMaterial({color: sp.body, emissive: sp.body, emissiveIntensity: 0.1, roughness: 0.45, flatShading: true});
  const accM = new THREE.MeshStandardMaterial({color: sp.accent, roughness: 0.6});
  const scl = {blob: [1, 1, 1], pup: [1.1, 0.85, 1.5], moss: [1.1, 0.95, 1.1], wisp: [1, 1, 1]}[sp.shape];
  const body = new THREE.Mesh(new THREE.IcosahedronGeometry(1, 1), bodyM);
  body.scale.set(scl[0], scl[1], scl[2]);
  g.add(body);
  const white = new THREE.MeshBasicMaterial({color: 0xffffff}), black = new THREE.MeshBasicMaterial({color: 0x111111});
  for (const s of [-1, 1]) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.22, 10, 8), white);
    e.position.set(0.4 * scl[0] * s, 0.25 * scl[1], 0.9 * scl[2]); g.add(e);
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 6), black);
    p.position.set(0.4 * scl[0] * s, 0.25 * scl[1], 1.05 * scl[2]); g.add(p);
  }
  const add = (geo, mat, x, y, z, rx = 0, ry = 0, rz = 0) => {
    const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.rotation.set(rx, ry, rz); g.add(m);
  };
  if (sp.shape === 'blob') {
    add(new THREE.ConeGeometry(0.25, 0.9, 6), accM, -0.5, 1.0, 0, 0, 0, 0.4);
    add(new THREE.ConeGeometry(0.25, 0.9, 6), accM, 0.5, 1.0, 0, 0, 0, -0.4);
  } else if (sp.shape === 'pup') {
    for (const [x, z] of [[-0.6, 0.9], [0.6, 0.9], [-0.6, -0.9], [0.6, -0.9]])
      add(new THREE.CylinderGeometry(0.18, 0.15, 0.9, 6), bodyM, x, -0.8, z);
    add(new THREE.ConeGeometry(0.3, 1.1, 6), accM, 0, 0.6, -1.7, -1.1, 0, 0);
    add(new THREE.ConeGeometry(0.22, 0.7, 5), accM, -0.45, 1.05, 0.8);
    add(new THREE.ConeGeometry(0.22, 0.7, 5), accM, 0.45, 1.05, 0.8);
  } else if (sp.shape === 'moss') {
    for (let i = 0; i < 3; i++)
      add(new THREE.ConeGeometry(0.5, 1.3, 5), accM, Math.cos(i * 2.1) * 0.5, 1.3, Math.sin(i * 2.1) * 0.5, Math.sin(i) * 0.4, 0, Math.cos(i) * 0.4);
  } else {
    add(new THREE.ConeGeometry(0.35, 1.6, 6), accM, 0, 0, -1.5, -Math.PI / 2, 0, 0);
    for (const s of [-1, 1]) add(new THREE.BoxGeometry(1.8, 0.08, 0.9), accM, 1.0 * s, 0.3, -0.1, 0, 0, -0.3 * s);
  }
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  const bb = new THREE.Box3().setFromObject(g);
  g.children.forEach(ch => { ch.position.y -= bb.min.y; });
  return {g, mat: bodyM};
}

const creatures = [];
function spawnCreature(sp, x, z) {
  const {g, mat} = buildCreature(sp);
  g.scale.setScalar(sp.size);
  g.userData = {sp, mat, home: {x, z}, tx: x, tz: z, wait: 0, fear: 0, t: Math.random() * 10,
                alt: sp.fly ? 2.5 + Math.random() * 2 : 0};
  g.position.set(x, heightAt(x, z), z);
  scene.add(g);
  creatures.push(g);
}

function updateCreatures(dt) {
  for (const c of creatures) {
    const u = c.userData, sp = u.sp;
    u.t += dt; u.fear = Math.max(0, u.fear - dt);
    u.mat.emissiveIntensity = 0.1 + nightF * 0.6;
    const dx = c.position.x - player.pos.x, dz = c.position.z - player.pos.z, d = Math.hypot(dx, dz);
    let speed = sp.speed;
    if (d < 7 || u.fear > 0) {
      const k = 16 / Math.max(d, 1);
      u.tx = c.position.x + dx * k; u.tz = c.position.z + dz * k;
      speed *= 2.2; u.wait = 0;
    } else if (u.wait <= 0) {
      for (let i = 0; i < 8; i++) {
        const a = Math.random() * 6.283, r = 3 + Math.random() * 12;
        const x = u.home.x + Math.cos(a) * r, z = u.home.z + Math.sin(a) * r;
        if (heightAt(x, z) > 0.8) { u.tx = x; u.tz = z; break; }
      }
      u.wait = 2 + Math.random() * 3;
    }
    u.wait -= dt;
    const mx = u.tx - c.position.x, mz = u.tz - c.position.z, md = Math.hypot(mx, mz);
    if (md > 0.4) {
      const step = Math.min(speed * dt, md);
      const nx = c.position.x + mx / md * step, nz = c.position.z + mz / md * step;
      if (sp.fly || heightAt(nx, nz) > -0.5) { c.position.x = nx; c.position.z = nz; }
      c.rotation.y = Math.atan2(mx, mz);
    }
    const ground = heightAt(c.position.x, c.position.z);
    if (sp.fly) c.position.y = ground + u.alt + Math.sin(u.t * 2.5) * 0.5;
    else c.position.y = ground + (md > 0.4 ? Math.abs(Math.sin(u.t * 9)) * 0.15 : 0);
  }
}

function randomCreatureSpawn() {
  const [x, z] = randomLand(2, 25);
  spawnCreature(pickSpecies(), x, z);
}

// ---------- Glimmer crystals ----------
const crystalG = new THREE.OctahedronGeometry(0.5);
const crystalM = new THREE.MeshStandardMaterial({color: 0xff8af0, emissive: 0xff4fd8, emissiveIntensity: 1.2, roughness: 0.2});
const crystals = [];
function spawnCrystal() {
  const [x, z] = randomLand(1.5, 0);
  const m = new THREE.Mesh(crystalG, crystalM);
  m.userData.base = heightAt(x, z) + 1.6;
  m.position.set(x, m.userData.base, z);
  scene.add(m);
  crystals.push(m);
}

// ---------- Orbs and sparks ----------
const orbG = new THREE.SphereGeometry(0.35, 12, 10);
const orbM = new THREE.MeshStandardMaterial({color: 0xffe0fb, emissive: 0xff8af0, emissiveIntensity: 1.5});
const shots = [];
const sparkG = new THREE.SphereGeometry(0.14, 6, 4);
const sparks = [];

function throwOrb() {
  if (player.orbs <= 0) { showMsg('Out of orbs. Collect glimmer crystals!'); return; }
  player.orbs--;
  const m = new THREE.Mesh(orbG, orbM);
  m.position.set(player.pos.x, player.pos.y + 2.4, player.pos.z);
  scene.add(m);
  shots.push({m, v: new THREE.Vector3(-Math.sin(player.yaw) * 24, 11, -Math.cos(player.yaw) * 24), life: 4});
  updateHud();
}

function burst(x, y, z, color, n) {
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(sparkG, new THREE.MeshBasicMaterial({color}));
    m.position.set(x, y, z); scene.add(m);
    sparks.push({m, v: new THREE.Vector3((Math.random() - 0.5) * 10, Math.random() * 9, (Math.random() - 0.5) * 10), life: 1});
  }
}

function tryCapture(c) {
  const sp = c.userData.sp;
  if (Math.random() < CATCH[sp.rarity]) {
    const first = !dex[sp.name];
    dex[sp.name] = (dex[sp.name] || 0) + 1;
    saveDex();
    player.caught++;
    if (first) { player.orbs += 3; showMsg(`New! ${sp.name} recorded. +3 orbs`); }
    else showMsg(`Caught ${sp.name}!`);
    burst(c.position.x, c.position.y + sp.size, c.position.z, sp.body, 26);
    scene.remove(c);
    creatures.splice(creatures.indexOf(c), 1);
    setTimeout(randomCreatureSpawn, 9000);
  } else {
    c.userData.fear = 4;
    showMsg(`${sp.name} broke free!`);
  }
  updateHud();
}

function updateShots(dt) {
  for (let i = shots.length - 1; i >= 0; i--) {
    const s = shots[i];
    s.v.y -= 22 * dt;
    s.m.position.addScaledVector(s.v, dt);
    s.life -= dt;
    const p = s.m.position, gh = Math.max(heightAt(p.x, p.z), 0);
    let done = false;
    for (const c of creatures) {
      const sz = c.userData.sp.size;
      const dist = Math.hypot(c.position.x - p.x, c.position.y + sz - p.y, c.position.z - p.z);
      if (dist < 1.8 * sz + 0.3) { tryCapture(c); done = true; break; }
    }
    if (!done && (p.y < gh + 0.2 || s.life <= 0)) {
      done = true;
      if (p.y < gh + 0.2) showMsg('Missed!');
    }
    if (done) { scene.remove(s.m); shots.splice(i, 1); }
  }
}

function updateSparks(dt) {
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.life -= dt;
    s.v.y -= 14 * dt;
    s.m.position.addScaledVector(s.v, dt);
    s.m.scale.setScalar(Math.max(s.life, 0.05));
    if (s.life <= 0) { scene.remove(s.m); sparks.splice(i, 1); }
  }
}

// ---------- Day and night ----------
let timeOfDay = 0.2, nightF = 0, elapsed = 0;
const DAY_SECONDS = 240;
const TOP_D = new THREE.Color(0x2fd1c8), HOR_D = new THREE.Color(0xfff0a8);
const TOP_N = new THREE.Color(0x1a0b3d), HOR_N = new THREE.Color(0x3b1f6e);
const TOP_DUSK = new THREE.Color(0xc2487a), HOR_DUSK = new THREE.Color(0xffc857);
function updateSky(dt) {
  timeOfDay = (timeOfDay + dt / DAY_SECONDS) % 1;
  const ang = timeOfDay * Math.PI * 2, el = Math.sin(ang);
  const dayF = clamp(el * 1.8 + 0.12, 0, 1), dusk = clamp(1 - Math.abs(el) * 5, 0, 1);
  nightF = 1 - dayF;
  skyU.top.value.copy(TOP_N).lerp(TOP_D, dayF).lerp(TOP_DUSK, dusk * 0.6);
  skyU.hor.value.copy(HOR_N).lerp(HOR_D, dayF).lerp(HOR_DUSK, dusk * 0.8);
  scene.fog.color.copy(skyU.hor.value);
  const dir = new THREE.Vector3(Math.cos(ang) * 0.8, el, 0.45).normalize();
  skyU.sunDir.value.copy(dir);
  sun.intensity = 0.05 + 2.0 * dayF;
  hemi.intensity = 0.25 + 0.8 * dayF;
  sun.position.copy(player.pos).addScaledVector(dir, 160);
  sun.target.position.copy(player.pos);
  sun.target.updateMatrixWorld();
  sky.position.copy(camera.position);
  ffMat.opacity = nightF * 0.9;
}

function updateFireflies() {
  for (let i = 0; i < FF; i++) {
    const x = player.pos.x + Math.sin(elapsed * 0.4 + i * 12.9) * 22;
    const z = player.pos.z + Math.cos(elapsed * 0.35 + i * 7.3) * 22;
    ffPos[i * 3] = x;
    ffPos[i * 3 + 1] = Math.max(heightAt(x, z), 0) + 1.2 + Math.sin(elapsed * 1.7 + i) * 0.8;
    ffPos[i * 3 + 2] = z;
  }
  ffGeo.attributes.position.needsUpdate = true;
}

// ---------- Input ----------
const keys = {};
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === ' ' && !e.repeat) { e.preventDefault(); throwOrb(); }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

let look = null;
renderer.domElement.addEventListener('pointerdown', e => { look = {id: e.pointerId, x: e.clientX, y: e.clientY}; });
addEventListener('pointermove', e => {
  if (look && e.pointerId === look.id) {
    player.yaw -= (e.clientX - look.x) * 0.008;
    player.pitch = clamp(player.pitch + (e.clientY - look.y) * 0.004, 0.15, 1.25);
    look.x = e.clientX; look.y = e.clientY;
  }
});
addEventListener('pointerup', e => { if (look && e.pointerId === look.id) look = null; });

const joy = {x: 0, y: 0};
const joyEl = $('joy'), knob = $('knob');
let joyId = null, joyC = {x: 0, y: 0};
function moveJoy(e) {
  const R = 50;
  let dx = e.clientX - joyC.x, dy = e.clientY - joyC.y;
  const d = Math.hypot(dx, dy), k = d > R ? R / d : 1;
  dx *= k; dy *= k;
  joy.x = dx / R; joy.y = -dy / R;
  knob.style.transform = `translate(${dx}px,${dy}px)`;
}
joyEl.addEventListener('pointerdown', e => {
  joyId = e.pointerId; joyEl.setPointerCapture(e.pointerId);
  const r = joyEl.getBoundingClientRect();
  joyC = {x: r.left + r.width / 2, y: r.top + r.height / 2};
  moveJoy(e);
});
joyEl.addEventListener('pointermove', e => { if (e.pointerId === joyId) moveJoy(e); });
function endJoy(e) {
  if (e.pointerId !== joyId) return;
  joyId = null; joy.x = 0; joy.y = 0; knob.style.transform = '';
}
joyEl.addEventListener('pointerup', endJoy);
joyEl.addEventListener('pointercancel', endJoy);
$('throw').addEventListener('pointerdown', e => { e.preventDefault(); throwOrb(); });

$('play').onclick = async () => {
  $('start').style.display = 'none';
  if (matchMedia('(pointer:coarse)').matches) {
    joyEl.style.display = 'block';
    $('throw').style.display = 'block';
    try { await document.documentElement.requestFullscreen(); await screen.orientation.lock('portrait'); } catch (e) {}
  }
};

addEventListener('resize', () => {
  fitCamera();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- Movement and camera ----------
function updatePlayer(dt) {
  const k = (...n) => n.some(x => keys[x]);
  let ix = (k('d', 'arrowright') ? 1 : 0) - (k('a', 'arrowleft') ? 1 : 0) + joy.x;
  let iz = (k('w', 'arrowup') ? 1 : 0) - (k('s', 'arrowdown') ? 1 : 0) + joy.y;
  const L = Math.hypot(ix, iz);
  if (L > 1) { ix /= L; iz /= L; }
  const s = Math.sin(player.yaw), c = Math.cos(player.yaw);
  const mx = -s * iz + c * ix, mz = -c * iz - s * ix;
  const moving = L > 0.01;
  if (moving) {
    const speed = heightAt(player.pos.x, player.pos.z) < 0 ? 5 : 9;
    const nx = clamp(player.pos.x + mx * speed * dt, -WORLD, WORLD);
    const nz = clamp(player.pos.z + mz * speed * dt, -WORLD, WORLD);
    if (heightAt(nx, nz) > -1.5) { player.pos.x = nx; player.pos.z = nz; }
    avatar.rotation.y = Math.atan2(mx, mz);
    player.walk += dt * 10;
  }
  player.pos.y = Math.max(heightAt(player.pos.x, player.pos.z), -0.3);
  avatar.position.set(player.pos.x, player.pos.y + (moving ? Math.abs(Math.sin(player.walk)) * 0.12 : 0), player.pos.z);
}

let lastDt = 0.016;
function updateCamera() {
  const tgt = new THREE.Vector3(player.pos.x, player.pos.y + 2.2, player.pos.z);
  const cp = Math.cos(player.pitch);
  const want = new THREE.Vector3(
    tgt.x + Math.sin(player.yaw) * cp * camDist,
    tgt.y + Math.sin(player.pitch) * camDist,
    tgt.z + Math.cos(player.yaw) * cp * camDist
  );
  const gy = heightAt(want.x, want.z) + 1.5;
  if (want.y < gy) want.y = gy;
  camera.position.lerp(want, 1 - Math.pow(0.0015, Math.min(lastDt, 0.05)));
  camera.lookAt(tgt);
}

// ---------- HUD ----------
let hudT = 0, msgT = 0;
function showMsg(t) { msgEl.textContent = t; msgEl.style.opacity = 1; msgT = 1.6; }
function updateHud() {
  const hh = Math.floor(timeOfDay * 24), mm = Math.floor((timeOfDay * 24 - hh) * 60);
  hudEl.innerHTML = `Glimmer orbs: ${player.orbs}<br>Caught: ${player.caught}<br>Time ${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
  const found = SPECIES.filter(s => dex[s.name]).length;
  const rows = SPECIES.map(s => dex[s.name] ? `✔ ${s.name} ×${dex[s.name]}` : '? ???').join('<br>');
  dexEl.innerHTML = `<b>Field Guide ${found}/${SPECIES.length}</b><br>${rows}`;
}

// ---------- Main loop ----------
function update(dt) {
  lastDt = dt; elapsed += dt;
  updatePlayer(dt);
  updateCreatures(dt);
  updateShots(dt);
  updateSparks(dt);
  updateSky(dt);
  updateFireflies();
  animateWater(elapsed);
  updateCamera();
  for (let i = crystals.length - 1; i >= 0; i--) {
    const m = crystals[i];
    m.rotation.y += dt * 2;
    m.position.y = m.userData.base + Math.sin(elapsed * 2.5 + i) * 0.3;
    if (Math.hypot(m.position.x - player.pos.x, m.position.z - player.pos.z) < 2.2 &&
        Math.abs(m.position.y - player.pos.y - 1.6) < 3) {
      scene.remove(m); crystals.splice(i, 1);
      player.orbs++;
      showMsg('+1 glimmer orb');
      updateHud();
      setTimeout(spawnCrystal, 8000);
    }
  }
  if (msgT > 0) { msgT -= dt; if (msgT <= 0) msgEl.style.opacity = 0; }
  hudT -= dt;
  if (hudT <= 0) { hudT = 0.25; updateHud(); }
}

for (let i = 0; i < 26; i++) randomCreatureSpawn();
for (let i = 0; i < 30; i++) spawnCrystal();
updateHud();

const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
</script>
